# Variante "hosted demo" du contrat nyc_taxi : meme regles que nyc_taxi.yml mais
# row_count adapte au jeu reduit (TAXI_MONTHS=2024-01, ~3 M lignes) utilise par la
# demo heergee free tier (Neon/Render). Le dataset est identique : le nom du data
# source "lakehouse" est arbitraire et pointe soit vers le Postgres local, soit
# vers Neon selon les variables  de ds_config.yml.
# Soda Core v4 contract — NYC TLC yellow taxi (6 mois : 2024-01 .. 2024-06, 20,3 M lignes).
# Regles derivees du Data Dictionary officiel NYC TLC :
#   https://www.nyc.gov/assets/tlc/downloads/pdf/data_dictionary_trip_records_yellow.pdf
# - Hard checks (bloquants) : domaines de valeurs officiels verifies sur les 20,3 M lignes
#   (0 violation) + plages largees sur les montants (outliers reels jusqu'a 334 076).
# - Warn checks (non bloquants, exit 2) : regles du dictionnaire que les donnees reelles
#   violent (remboursements/ajustements negatifs, 300 trajets a dates inversees).
# L'ordre des colonnes doit correspondre exactement au schema de la table
# (allow_extra_columns: false + ordre strict par defaut).

dataset: lakehouse/lakehouse/silver/nyc_taxi

columns:
  - name: vendor_id
    checks:
      - missing:
      - invalid:
          valid_values: [1, 2, 6, 7]
  - name: tpep_pickup_datetime
    checks:
      - missing:
  - name: tpep_dropoff_datetime
    checks:
      - missing:
  - name: passenger_count
    checks:
      - invalid:
          valid_min: 0
          valid_max: 9
  - name: trip_distance
    checks:
      - invalid:
          valid_min: 0
          valid_max: 400000
  - name: rate_code_id
    checks:
      - invalid:
          valid_values: [1, 2, 3, 4, 5, 6, 99]
  - name: store_and_fwd_flag
    checks:
      - invalid:
          valid_values: ['Y', 'N']
  - name: pulocationid
    checks:
      - missing:
      - invalid:
          valid_min: 1
          valid_max: 265
  - name: dolocationid
    checks:
      - missing:
      - invalid:
          valid_min: 1
          valid_max: 265
  - name: payment_type
    checks:
      - invalid:
          valid_values: [0, 1, 2, 3, 4, 5, 6]
  - name: fare_amount
    checks:
      - invalid:
          valid_min: -2000
          valid_max: 400000
  - name: extra
  - name: mta_tax
  - name: tip_amount
  - name: tolls_amount
  - name: improvement_surcharge
  - name: total_amount
    checks:
      - invalid:
          valid_min: -2000
          valid_max: 400000
  - name: congestion_surcharge
  - name: airport_fee
  - name: loaded_at
    checks:
      - missing:

checks:
  - schema:
      allow_extra_columns: false
  - row_count:
      threshold:
        must_be_greater_than_or_equal: 2500000
  - freshness:
      column: loaded_at
      threshold:
        unit: hour
        must_be_less_than: 336
  # --- Warn only (level: warn) : regles du dictionnaire, anomalies reelles observees ---
  - failed_rows:
      name: "Cohherence temporelle : dropoff >= pickup"
      qualifier: dropoff_before_pickup
      expression: "tpep_dropoff_datetime < tpep_pickup_datetime"
      threshold:
        metric: count
        must_be: 0
        level: warn
  - failed_rows:
      name: "Montants negatifs (remboursements/ajustements)"
      qualifier: negative_amounts
      expression: >
        fare_amount < 0 OR total_amount < 0 OR extra < 0 OR mta_tax < 0
        OR tip_amount < 0 OR tolls_amount < 0 OR improvement_surcharge < 0
        OR congestion_surcharge < 0 OR airport_fee < 0
      threshold:
        metric: count
        must_be: 0
        level: warn

